spring:
  application:
    name: almara-backend-test

  datasource:
    url: jdbc:h2:mem:almara_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: almara_user
    password: almara_secret_password
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      timeout: 2000ms

almara:
  emocion:
    segundos-bloqueo: 900
  h3:
    default-resolution: 9
