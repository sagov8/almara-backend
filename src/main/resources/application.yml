server:
  port: 8080

spring:
  application:
    name: almara-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/almara_db}
    username: ${SPRING_DATASOURCE_USERNAME:almara_user}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 2000ms

almara:
  emocion:
    # Lapso de bloqueo para la misma sesión/dispositivo (Criterio 1: 15 minutos = 900 segundos)
    segundos-bloqueo: 900
  h3:
    # Resolución estándar H3 para hexágonos urbanos (~100m - ~450m, RNF Adecuación Funcional)
    default-resolution: 9
