# ==============================================================================
# ALMARA BACKEND - CONFIGURACIÓN DE APLICACIÓN
# ==============================================================================

# Puerto de la API REST
server.port=8080

# Nombre de la aplicación Spring Boot
spring.application.name=almara-backend

# Configuración de Conexión a Redis (Caché y Control de Frecuencia)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis123}
spring.data.redis.timeout=2000ms

# Configuración de Negocio Almara
# Lapso de bloqueo obligatorio entre reportes de la misma sesión (15 minutos = 900 segundos)
almara.emocion.segundos-bloqueo=900
